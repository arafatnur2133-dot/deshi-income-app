<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>দেশি ইনকাম</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial', sans-serif; }
        body { background-color: #0b111e; color: #ffffff; padding: 15px; padding-bottom: 80px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .welcome-text { font-size: 14px; color: #8899a6; }
        .user-name { font-size: 22px; font-weight: bold; margin-top: 2px; }
        .coin-badge { background: #f3ba2f; color: #000; padding: 10px 15px; border-radius: 12px; font-weight: bold; font-size: 18px; }
        .balance-card { background: linear-gradient(135deg, #1c1a0e, #332a03); border: 1px solid #d4af37; border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        .balance-title { font-size: 13px; color: #aaaaaa; }
        .balance-amount { font-size: 38px; font-weight: bold; color: #ffeb3b; margin: 10px 0; }
        .balance-stats { display: flex; justify-content: space-between; margin-top: 15px; border-top: 1px solid #333; padding-top: 10px; font-size: 13px; color: #cccccc; }
        .alert-box { background: #1d1218; border: 1px solid #ff4d4d; border-radius: 15px; padding: 15px; margin-bottom: 20px; }
        .alert-header { color: #ff4d4d; font-weight: bold; font-size: 15px; margin-bottom: 8px; }
        .alert-text { font-size: 12px; color: #bbbbbb; line-height: 1.5; margin-bottom: 12px; }
        .open-btn { background: #ff477e; color: white; border: none; width: 100%; padding: 12px; border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer; text-align: center; display: block; text-decoration: none; }
        .ad-btn { background: linear-gradient(90deg, #ff477e, #ff5252); color: white; border: none; padding: 12px 20px; border-radius: 25px; font-weight: bold; font-size: 14px; position: fixed; bottom: 85px; right: 15px; box-shadow: 0 4px 15px rgba(255,71,126,0.4); cursor: pointer; }
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #16202c; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #22303c; }
        .nav-item { text-align: center; color: #8899a6; font-size: 11px; text-decoration: none; }
        .nav-item.active { color: #f3ba2f; }
        .nav-icon { font-size: 18px; margin-bottom: 3px; display: block; }
    </style>
</head>
<body>
    <div class="top-bar">
        <div>
            <div class="welcome-text">স্বাগতম 👋</div>
            <div class="user-name" id="userName">ইউজার</div>
        </div>
        <div class="coin-badge">🪙</div>
    </div>

    <div class="balance-card">
        <div class="balance-title">মোট ব্যালেন্স</div>
        <div class="balance-amount"><span id="balance">53.00</span> ৳</div>
        <div class="balance-stats">
            <div>মোট এড: <b id="totalAds">0</b></div>
            <div>মোট আয়: <b id="totalIncome">53.00</b></div>
            <div>রেফারেল: <b id="referrals">0</b></div>
        </div>
    </div>

    <div class="alert-box">
        <div class="alert-header">⚠️ বট খুলুন – না হলে পেমেন্ট পাবেন না!</div>
        <div class="alert-text">পেমেন্ট আপডেট ও অ্যাকাউন্ট সুরক্ষিত রাখতে নিচের বাটন থেকে <b>@ClickTaskearn_bot</b> খুলুন এবং স্টার্ট দিন।</div>
        <a href="https://t.me/ClickTaskearn_bot" class="open-btn">📢 বট খুলুন (Open Bot)</a>
    </div>

    <button class="ad-btn" onclick="showAd()">🔥 নতুন ভিডিও দেখুন ১০০ টাকা</button>

    <div class="nav-bar">
        <div class="nav-item active"><span class="nav-icon">🏠</span>হোম</div>
        <div class="nav-item"><span class="nav-icon">📋</span>টাস্ক</div>
        <div class="nav-item"><span class="nav-icon">👥</span>রেফারেল</div>
        <div class="nav-item"><span class="nav-icon">👛</span>উত্তোলন</div>
        <div class="nav-item"><span class="nav-icon">👤</span>প্রোফাইল</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('userName').innerText = tg.initDataUnsafe.user.first_name;
        }

        function showAd() {
            window.open("https://omg10.com/4/11820449", "_blank");
        }
    </script>
</body>
</html>
